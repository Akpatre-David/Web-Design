name: Build and Deploy Portfolio

on:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build React app
      run: npm run build

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/portfolio:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }} \
          .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/portfolio:latest

    # SSH into EC2 and deployment
    - name: Deploy to EC2 Instance
      uses: appleboy/ssh-action@1.2.2
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIAVTE_KEY }}
        script: |
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/portfolio:latest

          sudo docker stop portfolio || true
          sudo docker rm portfolio || true

          sudo docker run -d \
            --name portfolio \
            --restart unless-stopped \
            -p 80:80 \
            ${{ secrets.DOCKER_USERNAME }}/portfolio:latest
